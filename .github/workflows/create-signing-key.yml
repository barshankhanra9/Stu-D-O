name: Create and Store Signing Key

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: 'Passphrase to lock your signing key (leave blank for none)'
        required: false
        default: ''
        type: string

jobs:
  generate-signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Ed25519 Signing Key Pair
        env:
          KEY_PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          ssh-keygen -t ed25519 -C "github-signing-key" -f ./signing_key -N "$KEY_PASSPHRASE"

      - name: Save Private Key & Passphrase to Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_TOKEN }}
          KEY_PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          gh secret set SIGNING_PRIVATE_KEY --repo "${{ github.repository }}" < ./signing_key
          if [ -n "$KEY_PASSPHRASE" ]; then
            echo -n "$KEY_PASSPHRASE" | gh secret set SIGNING_KEY_PASSPHRASE --repo "${{ github.repository }}"
          fi

      - name: Print Public Key
        run: |
          echo "COPY THE LINE BELOW:"
          cat ./signing_key.pub
          
