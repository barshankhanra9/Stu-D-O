name: Create Android Release Keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore Password (minimum 6 characters)'
        required: true
        type: string
      key_alias:
        description: 'Key Alias (keep default or enter custom)'
        required: true
        default: 'studo-release-key'
        type: string
      key_password:
        description: 'Key Password (minimum 6 characters, can match keystore password)'
        required: true
        type: string

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Android .jks Keystore
        env:
          STORE_PASS: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=StuDO, OU=Mobile, O=StuDO, L=Kharagpur, S=West Bengal, C=IN"

      - name: Save Keystore & Passwords to GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_TOKEN }}
          STORE_PASS: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          base64 -w 0 release-keystore.jks | gh secret set ANDROID_KEYSTORE_BASE64 --repo "${{ github.repository }}"
          echo -n "$STORE_PASS" | gh secret set ANDROID_STORE_PASSWORD --repo "${{ github.repository }}"
          echo -n "$KEY_ALIAS" | gh secret set ANDROID_KEY_ALIAS --repo "${{ github.repository }}"
          echo -n "$KEY_PASS" | gh secret set ANDROID_KEY_PASSWORD --repo "${{ github.repository }}"
          echo "All 4 Android signing secrets have been securely saved!"
          
