name: StuDO Android APK Build & Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test StuDO
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Load SSH signing key into ssh-agent
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -z "${SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::SIGNING_PRIVATE_KEY secret is not set."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          CLEAN_KEY="${SIGNING_PRIVATE_KEY//$'\r'/}"
          printf '%s\n' "${CLEAN_KEY%$'\n'}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key

          ssh-keygen -y -P "${SIGNING_KEY_PASSPHRASE:-}" -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub
          chmod 644 ~/.ssh/signing_key.pub

          eval "$(ssh-agent -s)"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          if [ -n "${SIGNING_KEY_PASSPHRASE:-}" ]; then
            ASKPASS_SCRIPT="$(mktemp)"
            {
              echo '#!/usr/bin/env bash'
              echo 'printf "%s\n" "$SIGNING_KEY_PASSPHRASE"'
            } > "$ASKPASS_SCRIPT"
            chmod 700 "$ASKPASS_SCRIPT"
            DISPLAY=":0" SSH_ASKPASS="$ASKPASS_SCRIPT" SSH_ASKPASS_REQUIRE="force" \
              ssh-add ~/.ssh/signing_key < /dev/null
            rm -f "$ASKPASS_SCRIPT"
          else
            ssh-add ~/.ssh/signing_key < /dev/null
          fi

      - name: Configure Git for SSH commit signing
        run: |
          git config --local gpg.format ssh
          git config --local user.signingkey "$HOME/.ssh/signing_key.pub"
          git config --local commit.gpgsign true
          git config --local user.name || git config --local user.name "github-actions[bot]"
          git config --local user.email || git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Android SDK 36 requires Java 21 for compilation and Robolectric sandboxing
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Secrets Gradle Plugin requires .env file to exist in workspace
      - name: Prepare Environment (.env)
        run: |
          cp -n .env.example .env || touch .env

      # Restore debug keystore for debugConfig signingConfig in build.gradle.kts
      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Executable Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Cache Robolectric Android All Instrumented JARs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ runner.os }}-robolectric-16-13921718-i7
          restore-keys: |
            ${{ runner.os }}-robolectric-

      # Verify, clean stale/corrupt artifacts, and ensure Android 16 instrumented runtime is present
      - name: Verify or Pre-fetch Robolectric Android 16 Instrumented Runtime
        run: |
          ROBO_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          ROBO_JAR="$ROBO_DIR/android-all-instrumented-16-robolectric-13921718-i7.jar"
          EXPECTED_SIZE=213431622

          if [ -f "$ROBO_JAR" ]; then
            ACTUAL_SIZE=$(stat -c%s "$ROBO_JAR" 2>/dev/null || stat -f%z "$ROBO_JAR" 2>/dev/null || echo 0)
            if [ "$ACTUAL_SIZE" -lt "$EXPECTED_SIZE" ]; then
              echo "Cached Robolectric artifact is incomplete ($ACTUAL_SIZE bytes < $EXPECTED_SIZE). Removing..."
              rm -rf "$ROBO_DIR"
            else
              echo "Verified complete Robolectric Android 16 instrumented runtime JAR ($ACTUAL_SIZE bytes)."
            fi
          fi

          if [ ! -f "$ROBO_JAR" ]; then
            echo "Downloading Android 16 instrumented runtime from Maven Central..."
            mkdir -p "$ROBO_DIR"
            curl -fSL --retry 3 --retry-delay 5 -o "$ROBO_JAR" \
              "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/android-all-instrumented-16-robolectric-13921718-i7.jar"
            DOWNLOADED_SIZE=$(stat -c%s "$ROBO_JAR" 2>/dev/null || stat -f%z "$ROBO_JAR" 2>/dev/null || echo 0)
            echo "Successfully downloaded $DOWNLOADED_SIZE bytes."
          fi

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release-keystore.jks

      - name: Build StuDO Release APK
        env:
          KEYSTORE_FILE: release-keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload StuDO Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StuDO-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean Up Release Keystore
        if: always()
        run: rm -f app/release-keystore.jks

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
